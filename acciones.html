<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Río Zahuapan</title>

<link rel="stylesheet" href="estilos.css">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background-color: #050505;
    transition: background-color 0.3s, color 0.3s;
}

.navegacion {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    background-color: black;
}

.navegacion a {
    color: white;
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
    white-space: nowrap;
    transition: background-color 0.3s;
}

.navegacion a:hover,
.navegacion a.activo {
    background-color: #6B6255;
}

.boton-tema {
    margin-right: auto;
    padding: 10px 14px;
    margin-top: 5px;
    margin-bottom: 5px;
    border: none;
    border-radius: 5px;
    background-color: #6B6255;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s, color 0.3s;
}

.infografia {
    width: 90%;
    max-width: 1200px;
    margin: 50px auto;
    padding: 35px;
    background-color: rgba(20, 20, 20, 0.92);
    border-radius: 20px;
    text-align: center;
    transition: background-color 0.3s;
}

img {
    display: block;
    width: 70%;
    max-width: 100%;
    height: auto;
    margin: auto;
    border-radius: 20px;
    box-shadow: 0 0 20px blue;
    transition: transform 0.3s;
}

img:hover {
    transform: scale(1.02);
}

body.claro {
    background-color: #F1F1E9;
    color: #222;
}

body.claro .navegacion {
    background-color: #D9E5D7;
}

body.claro .navegacion a {
    color: #263D30;
}

body.claro .navegacion a:hover,
body.claro .navegacion a.activo {
    background-color: #A9C5AD;
}

body.claro .boton-tema {
    background-color: #A9C5AD;
    color: #263D30;
}

body.claro .infografia {
    background-color: #E4E9DF;
}

@media screen and (max-width: 900px) {
    .infografia {
        padding: 25px;
    }

    img {
        width: 90%;
    }
}

@media screen and (max-width: 768px) {
    .navegacion a {
        padding: 12px 10px;
        font-size: 14px;
    }
}

@media screen and (max-width: 480px) {
    body {
        padding: 0;
    }

    .navegacion a {
        padding: 12px 8px;
        font-size: 12px;
    }

    .boton-tema {
        margin: 5px;
        font-size: 19px;
    }

    .infografia {
        width: 100%;
        margin: 20px auto;
        padding: 15px;
    }

    img {
        width: 100%;
    }
}

</style>
</head>

<body>

<header>
    <div class="navegacion">

        <button class="boton-tema" onclick="cambiarTema()" id="botonTema">🌞</button>

        <a href="acciones.html">Participación</a>
        <a href="simulacion.html">Contaminantes</a>
        <a href="importancia.html">Importancia</a>
        <a href="actualidad.html">Actualidad</a>
        <a href="ubicacion.html">Ubicación</a>
        <a href="informacion.html">Información</a>
        <a href="index.html">Inicio</a>

    </div>
</header>

<section class="infografia">

    <img src="redes_sociales.jpeg" alt="Infografía sobre la participación y las redes sociales">

</section>

<script>

function cambiarTema() {
    document.body.classList.toggle("claro");

    const temaClaro = document.body.classList.contains("claro");

    localStorage.setItem("tema-zahuapan", temaClaro ? "claro" : "oscuro");

    document.getElementById("botonTema").textContent = temaClaro ? "🌙" : "🌞";
}

const temaGuardado = localStorage.getItem("tema-zahuapan");
const boton = document.getElementById("botonTema");

if (temaGuardado === "claro") {
    document.body.classList.add("claro");
    boton.textContent = "🌙";
} else {
    document.body.classList.remove("claro");
    boton.textContent = "🌞";
}

const paginaActual = window.location.pathname.split("/").pop();

document.querySelectorAll(".navegacion a").forEach(enlace => {
    if (enlace.getAttribute("href") === paginaActual) {
        enlace.classList.add("activo");
    }
});

</script>

</body>
</html>
