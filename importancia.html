<!DOCTYPE html>
<html lang="es">

<head>
<title>Río Zahuapan</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

body {
    padding: 20px;
    color: white;
    background-color: black;
    margin: 0;
    font-family: arial, helvetica, sans-serif;
    transition: background-color 0.3s, color 0.3s;
}

.navegacion {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    background-color: black;
    transition: background-color 0.3s;
}

.navegacion a {
    color: white;
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
    white-space: nowrap;
    transition: background-color 0.3s;
}

.navegacion a:hover {
    background-color: #6B6255;
}

.navegacion a.activo {
    background-color: #6B6255;
}

.boton-tema {
    margin-right: auto;
    padding: 10px 14px;
    margin-top: 5px;
    margin-bottom: 5px;
    border: none;
    border-radius: 5px;
    background-color: #6B6255;
    color: white;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s, color 0.3s;
}

.infografia {
    text-align: center;
    margin-top: 30px;
}

.infografia img {
    width: 70%;
    max-width: 100%;
    height: auto;
    border-radius: 10px;
    transition: transform 0.3s;
}

.infografia img:hover {
    transform: scale(1.02);
}

body.claro {
    background-color: #F1F1E9;
    color: #222;
}

body.claro .navegacion {
    background-color: #D9E5D7;
}

body.claro .navegacion a {
    color: #263D30;
}

body.claro .navegacion a:hover,
body.claro .navegacion a.activo {
    background-color: #A9C5AD;
}

body.claro .boton-tema {
    background-color: #A9C5AD;
    color: #263D30;
}

@media screen and (max-width: 768px) {

    .infografia img {
        width: 90%;
    }

    .navegacion a {
        padding: 12px 10px;
        font-size: 14px;
    }

}

@media screen and (max-width: 480px) {

    body {
        padding: 10px;
    }

    .infografia img {
        width: 100%;
    }

    .navegacion {
        justify-content: flex-end;
    }

    .navegacion a {
        padding: 12px 8px;
        font-size: 12px;
    }

    .boton-tema {
        font-size: 19px;
    }

}

</style>
</head>

<body>

<header>

<div class="navegacion">

<button class="boton-tema" onclick="cambiarTema()" id="botonTema">🌙</button>

<a href="acciones.html">Participación</a>
<a href="simulacion.html">Contaminantes</a>
<a href="actualidad.html">Actualidad</a>
<a href="ubicacion.html">Ubicación</a>
<a href="informacion.html">Información</a>
<a href="index.html">Inicio</a>

</div>

</header>

<br>
<br>

<div class="infografia">

<img src="info_importancia.png" alt="Infografía sobre la importancia del río Zahuapan">

</div>

<script>

function cambiarTema() {
    document.body.classList.toggle("claro");

    let tema = document.body.classList.contains("claro") ? "claro" : "oscuro";

    localStorage.setItem("tema-zahuapan", tema);

    document.getElementById("botonTema").textContent = tema === "claro" ? "🌞" : "🌙";
}

let temaGuardado = localStorage.getItem("tema-zahuapan");

if (temaGuardado === "claro") {
    document.body.classList.add("claro");
    document.getElementById("botonTema").textContent = "🌞";
}

let paginaActual = window.location.pathname.split("/").pop();

document.querySelectorAll(".navegacion a").forEach(enlace => {
    if (enlace.getAttribute("href") === paginaActual) {
        enlace.classList.add("activo");
    }
});

</script>

</body>
</html>
