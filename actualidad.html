<!DOCTYPE html>
<html lang="es">

<head>

<title>Río Zahuapan</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

body {

    padding: 20px;
    color: white;
    background-color: black;
    margin: 0;
    font-family: arial, helvetica, sans-serif;

    transition: background-color 0.3s ease, color 0.3s ease;

}

body.claro {

    color: #222222;
    background-color: #F1F1E9;

}

.navegacion {

    overflow: hidden;
    background-color: black;

    transition: background-color 0.3s ease;

}

body.claro .navegacion {

    background-color: #D9E5D7;

}

.navegacion a {

    float: right;
    color: white;
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;

    transition: background-color 0.3s ease;

}

body.claro .navegacion a {

    color: #263D30;

}

.navegacion a:hover {

    background-color: #6B6255;

}

.navegacion a.activo {

    background-color: #6B6255;
    border-bottom: 3px solid white;

}

#cambiar-tema {

    float: left;
    margin: 5px;
    padding: 7px 12px;

    font-size: 21px;
    cursor: pointer;

    background: transparent;
    border: 1px solid gray;
    border-radius: 8px;

    transition: background-color 0.3s ease;

}

#cambiar-tema:hover {

    background-color: #6B6255;

}

.infografia {

    text-align: center;
    margin-top: 20px;

}

.infografia img {

    width: 70%;
    max-width: 100%;
    height: auto;

    border-radius: 10px;

}

@media screen and (max-width: 768px) {

    .navegacion a {

        padding: 12px 10px;
        font-size: 14px;

    }

    .infografia img {

        width: 90%;

    }

}

@media screen and (max-width: 480px) {

    body {

        padding: 10px;

    }

    .navegacion a {

        padding: 12px 8px;
        font-size: 12px;

    }

    #cambiar-tema {

        font-size: 19px;

    }

    .infografia img {

        width: 100%;

    }

}

</style>

</head>

<body>

<header>

<div class="navegacion">

<button id="cambiar-tema" onclick="cambiarTema()" aria-label="Activar modo claro">🌞</button>

<a href="acciones.html"> participación </a>

<a href="simulacion.html"> Contaminantes </a>

<a href="importancia.html"> Importancia </a>

<a href="ubicacion.html"> Ubicación </a>

<a href="informacion.html"> Información </a>

<a href="index.html"> Inicio </a>

</div>

</header>


<br>


<center>

<div class="infografia">

<img src="info_actualidad.png" alt="Infografía sobre la actualidad del Río Zahuapan">

</div>

</center>


<script>

function aplicarTema(tema) {

    let boton = document.getElementById("cambiar-tema");

    if (tema === "claro") {

        document.body.classList.add("claro");
        boton.textContent = "🌙";
        boton.setAttribute("aria-label", "Activar modo oscuro");

    } else {

        document.body.classList.remove("claro");
        boton.textContent = "🌞";
        boton.setAttribute("aria-label", "Activar modo claro");

    }

    try {

        localStorage.setItem("tema-zahuapan", tema);

    } catch (error) {
    }

}

function cambiarTema() {

    let temaActual = document.body.classList.contains("claro") ? "claro" : "oscuro";

    aplicarTema(temaActual === "claro" ? "oscuro" : "claro");

}

let temaGuardado = "oscuro";

try {

    temaGuardado = localStorage.getItem("tema-zahuapan") || "oscuro";

} catch (error) {
}

aplicarTema(temaGuardado);


let pagina = window.location.pathname.split("/").pop();

let enlaces = document.querySelectorAll(".navegacion a");

enlaces.forEach(function(enlace) {

    if (enlace.getAttribute("href") === pagina) {

        enlace.classList.add("activo");

        enlace.setAttribute("aria-current", "page");

    }

});

</script>

</body>

</html>
